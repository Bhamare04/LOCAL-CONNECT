stages:

  preprocess:
    cmd: python ml/scripts/preprocess_recommendation_data.py
    deps:
      - ml/scripts/preprocess_recommendation_data.py
      - ml/recommendation/feature_engineering.py
      - ml/data/online_places.csv
    outs:
      - ml/data/processed_places.csv

  train:
    cmd: python ml/scripts/train_recommender.py
    deps:
      - ml/scripts/train_recommender.py
      - ml/recommendation/recommender.py
      - ml/recommendation/feature_engineering.py
      - ml/data/processed_places.csv
    outs:
      - ml/models/travel_recommender.pkl